# Authority recipe for afa-somali — see docs/CURATION_MACHINERY.md
# Descriptive companion to config.yaml + custom/*. ENFORCED fields name build
# mechanisms; all others are advisory. Scaffolded by `build.py packet`; edit freely.
av_id: afa-somali
name: Somali
review:
  status: draft
  reviewer: ""
  date: ""
quality:                     # advisory mirror of config.scoring
  tier: bronze
  forms_score: 0.9128
  cognates_score: 0.0671
  pinned: true
construction:
  summary: >
    Wiktionary with a broad segmental Somali Latin-script profile; coverage pilot,
    with specialist review pending. Tone and vowel-harmony qualities are not inferred.
  lexical_base:
    source: wiktionary            # ENFORCED -> config.sources.transcription
    rationale: "112 core concepts versus GLED's 37; see PACKET.md for losses and limitations."
  transcription:
    strategy: profile
    profile: custom/profile.tsv    # ENFORCED (extensions.profile)
    overrides: none     # ENFORCED (extensions.transcriptions)
    notes: "1011 profile-derived forms; 14 unclean. Broad vowels only; no inferred tone or vowel harmony."
  concepts:
    mapping: source        # ENFORCED via custom/concept_map.csv when corrected
    core_coverage: 112/161
    notes: 612/1025 forms mapped; 510 distinct concepts.
  cognates:
    source: wiktionary            # ENFORCED -> config.sources.cognates
    method: source          # expert|computed|manual|hybrid|source|none
    computed: none            # method metadata block when computed
    notes: "172 Wiktionary etymology annotations; not expert comparative judgments."
  loans:
    handling: source
    annotated: 8%
    notes: ""
candidates:
  - source: wiktionary
    coverage: partial
    verdict: used
    reason: "Broad vocabulary with a regular spelling system; 112/161 core concepts."
  - source: gled
    coverage: partial
    verdict: not used
    reason: "Only 37 core concepts, but contains four absent from Wiktionary."
provenance:
  bibliography: [wiktionary_kaikki2026]
tradeoffs:
  gains: "79 additional core concepts; 510 mapped concepts in total."
  known_losses: "Four core concepts and GLED cognacy coverage; profile does not encode unwritten phonological distinctions."
notes: "Mechanical forms score recomputed on profiled intake; bronze retained conservatively. Evidence and transcription conventions are recorded in PACKET.md."
